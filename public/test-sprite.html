<!DOCTYPE html>
<html>
<head><title>SVG Sprite Test</title></head>
<body style="background:#333; color:white; padding:20px;">
<h2>SVG Sprite Test</h2>
<div id="test-icons" style="display:flex; gap:10px; flex-wrap:wrap;"></div>

<script>
const URLS = [
  '/common/icons/svg-icons-amenities.svg',
  '/common/icons/svg-icons-landmarks.svg',
];
const TEST_IDS = [
  'amenity-airport',
  'amenity-landmark',
  'amenity-landmark-ferrari-world',
  'amenity-landmark-yas-marina-circuit',
  'amenity-landmark-al-fahid-island',
  'amenity-landmark-saadiyat-island',
  'amenity-landmark-yas-links-abu-dhabi',
];

async function loadSprites() {
  // Create ONE svg element, inject all symbols' innerHTML into it
  const svgNS = 'http://www.w3.org/2000/svg';
  const masterSvg = document.createElementNS(svgNS, 'svg');
  masterSvg.setAttribute('style', 'position:absolute;width:0;height:0;overflow:hidden;');
  masterSvg.id = 'all-sprites';

  for (const url of URLS) {
    const resp = await fetch(url);
    const text = await resp.text();
    // Extract inner content (everything between <svg...> and </svg>)
    const innerMatch = text.match(/<svg[^>]*>([\s\S]*)<\/svg>/);
    if (innerMatch) {
      // Use a temp div with innerHTML parsed in SVG context
      const tempSvg = document.createElementNS(svgNS, 'svg');
      tempSvg.innerHTML = innerMatch[1];
      // Move symbols to master
      const symbols = tempSvg.querySelectorAll('symbol');
      console.log(url, '- symbols:', symbols.length);
      symbols.forEach(s => masterSvg.appendChild(s));
    }
  }

  document.body.appendChild(masterSvg);
  console.log('Total symbols in master:', masterSvg.querySelectorAll('symbol').length);

  const container = document.getElementById('test-icons');
  TEST_IDS.forEach(id => {
    const exists = !!document.getElementById(id);
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:4px;';
    wrap.innerHTML = `
      <div style="background:#555; border-radius:50%; padding:8px; display:inline-flex;">
        <svg width="32" height="32" fill="white" viewBox="0 0 24 24"><use href="#${id}"/></svg>
      </div>
      <span style="font-size:10px;">${id}</span>
      <span style="font-size:9px; color:${exists?'lime':'red'}">exists=${exists}</span>
    `;
    container.appendChild(wrap);
  });
}
loadSprites();
</script>
</body>
</html>
